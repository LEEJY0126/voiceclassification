# ============================================================
# odas.cfg - ReSpeaker USB 4 Mic Array (6ch firmware)
# ============================================================
#
# 사전 준비:
#   1. 6채널 펌웨어 플래시
#      python dfu.py --download 6_channels_firmware.bin
#
#   2. 사운드카드 번호 확인 (card 값 수정 필요)
#      arecord -l
#      → "card X: ... ReSpeaker ..." 에서 X를 아래 card에 입력
#
#   3. ODAS 빌드
#      sudo apt-get install libfftw3-dev libconfig-dev libasound2-dev
#      git clone https://github.com/introlab/odas.git
#      mkdir odas/build && cd odas/build
#      cmake .. && make
#
#   4. 실행
#      ./bin/odaslive -s odas.cfg
#
# TCP 출력:
#   port 9000 → tracked sources  (ROS2 bridge가 여기서 읽음)
#   port 9001 → potential sources
# ============================================================

version = "2.1";

# ── Raw audio input ─────────────────────────────────────────
raw:
{
    fS = 16000;
    hopSize = 128;
    nBits = 16;
    nChannels = 6;

    interface: {
        type = "soundcard";
        card = 1;       # ← arecord -l 로 확인 후 수정
        device = 0;
    };
};

# ── Channel mapping ─────────────────────────────────────────
# 6ch 펌웨어 채널 구성:
#   ch 0: processed audio (ASR용)  → pyaudio에서 읽음
#   ch 1: mic 1 raw                → ODAS는 이 채널들 사용
#   ch 2: mic 2 raw
#   ch 3: mic 3 raw
#   ch 4: mic 4 raw
#   ch 5: playback
# 0-indexed로 ch 1~4 = index 1,2,3,4 → 아래 map: (1,2,3,4)
mapping:
{
    map: (2, 3, 4, 5);
};

# ── General ─────────────────────────────────────────────────
general:
{
    epsilon = 1E-20;

    size:
    {
        hopSize = 128;
        frameSize = 256;
    };

    samplerate:
    {
        mu = 16000;
        sigma2 = 0.01;
    };

    speedofsound:
    {
        mu = 343.0;
        sigma2 = 25.0;
    };

    # ── 마이크 위치 (미터, 중심 기준) ──────────────────────
    # ReSpeaker USB 4 Mic Array: 직경 70mm 원형 배열
    # 4개 마이크가 십자형으로 배치, 중심에서 32mm 거리
    #
    #        Mic3 (앞, +y)
    #          |
    # Mic2 ---+--- Mic4
    # (-x)    |    (+x)
    #        Mic5 (뒤, -y)
    #
    mics = (
        # Mic 2 (-x 방향)
        {
            mu = ( -0.032, +0.000, +0.000 );
            sigma2 = ( 0,0,0, 0,0,0, 0,0,0 );
            direction = ( +0.000, +0.000, +1.000 );
            angle = ( 80.0, 100.0 );
        },
        # Mic 3 (-y 방향)
        {
            mu = ( +0.000, -0.032, +0.000 );
            sigma2 = ( 0,0,0, 0,0,0, 0,0,0 );
            direction = ( +0.000, +0.000, +1.000 );
            angle = ( 80.0, 100.0 );
        },
        # Mic 4 (+x 방향)
        {
            mu = ( +0.032, +0.000, +0.000 );
            sigma2 = ( 0,0,0, 0,0,0, 0,0,0 );
            direction = ( +0.000, +0.000, +1.000 );
            angle = ( 80.0, 100.0 );
        },
        # Mic 5 (+y 방향)
        {
            mu = ( +0.000, +0.032, +0.000 );
            sigma2 = ( 0,0,0, 0,0,0, 0,0,0 );
            direction = ( +0.000, +0.000, +1.000 );
            angle = ( 80.0, 100.0 );
        }
    );

    # 수평 방향 소리만 탐지 (바닥/천장 오탐 방지)
    spatialfilters = (
        {
            direction = ( +0.000, +0.000, +1.000 );
            angle = ( 80.0, 100.0 );
        }
    );

    nThetas = 181;
    gainMin = 0.25;
};

# ── Stationary Noise Estimation ──────────────────────────────
sne:
{
    b = 3;
    alphaS = 0.1;
    L = 150;
    delta = 3.0;
    alphaD = 0.1;
};

# ── Sound Source Localization (SSL) ─────────────────────────
ssl:
{
    nPots = 1;
    nMatches = 10;
    probMin = 0.5;
    nRefinedLevels = 1;
    interpRate = 4;

    scans = (
        { level = 2; delta = -1; },
        { level = 4; delta = -1; }
    );

    # potential sources → port 9001
    potential: {
        format = "undefined";
        interface: {
            type = "blackhole";
        };
    };
};

# ── Sound Source Tracking (SST) ──────────────────────────────
sst:
{
    mode = "kalman";
    add = "static";

    active = (
        { weight = 1.0; mu = 0.4; sigma2 = 0.0025 }
    );
    inactive = (
        { weight = 1.0; mu = 0.25; sigma2 = 0.0025 }
    );

    sigmaR2_prob = 0.0025;
    sigmaR2_active = 0.0225;
    sigmaR2_target = 0.0025;
    Pfalse = 0.1;
    Pnew = 0.4;      # 0.1 → 0.4 (새 소스 더 쉽게 추가)
    Ptrack = 0.9;    # 추적 유지 확률 높임
    theta_new = 0.5; # 0.9 → 0.5 (낮출수록 더 쉽게 소스 생성)
    N_prob = 5;
    theta_prob = 0.8;
    N_inactive = ( 250, 250, 250, 250 );
    theta_inactive = 0.9;

    kalman: {
        sigmaQ = 0.001;
    };

    particle: {
        nParticles = 1000;
        st_alpha = 2.0;
        st_beta = 0.04;
        st_ratio = 0.5;
        ve_alpha = 0.05;
        ve_beta = 0.2;
        ve_ratio = 0.3;
        ac_alpha = 0.5;
        ac_beta = 0.2;
        ac_ratio = 0.2;
        Nmin = 0.7;
    };

    target: (); 

    # tracked sources → port 9000 (ROS2 bridge가 여기서 읽음)
    tracked: {
        format = "json";
        interface: {
            type = "socket"; ip = "127.0.0.1"; port = 9000;
        };
    };
};

# ── Sound Source Separation (SSS) ────────────────────────────
sss:
{
    mode_sep = "dds";
    mode_pf = "ms";
    gain_sep = 1.0;
    gain_pf = 10.0;

    dds: {};

    dgss: {
        mu = 0.01;
        lambda = 0.5;
    };

    dmvdr: {}; 

    ms: {
        alphaPmin = 0.07;
        eta = 0.5;
        alphaZ = 0.8;
        thetaWin = 0.3;
        alphaWin = 0.3;
        maxAbsenceProb = 0.9;
        Gmin = 0.01;
        winSizeLocal = 3;
        winSizeGlobal = 23;
        winSizeFrame = 256;
    };

    ss: {
        Gmin = 0.01;
        Gmid = 0.9;
        Gslope = 10.0;
    };


    separated: {
        fS = 16000;
        hopSize = 128;
        nBits = 16;
        interface: {
            type = "blackhole";
            port = 9002;
        };
    };
    postfiltered: {
        fS = 16000;
        hopSize = 128;
        nBits = 16;
        gain = 10.0;
        interface: { type = "blackhole"; };
    };
};

# ── Classify ─────────────────────────────────────────────────
classify:
{
    frameSize = 4096;
    winSize = 3;
    tauMin = 88;
    tauMax = 551;
    deltaTauMax = 20;
    alpha = 0.3;
    gamma = 0.05;
    phiMin = 0.5;
    r0 = 0.2;
    category: {
        format = "undefined";
        interface: { type = "blackhole"; };
    };
};
